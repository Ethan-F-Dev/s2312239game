        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
        
        #menu { position: absolute; inset: 0; background: radial-gradient(circle, #222, #000); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; pointer-events: auto; }

<div id="game-mode">

    <button class="mode-btn" id="btn-mode-sf" onclick="selectMode('sf')">

    </button>

<div id="menu">

    <div id="current-mode-badge">Mode: <span id="current-mode-label">Unselected</span></div>
    <div id="char-select-title">Choose a character</div>

<script>
    // Global Session Variables
    const playerName = "<?= playerName ?>";
    let currentSelectedMode = null; 
    let peer = null;
    let connection = null;
    let myPeerId = null;
    let myRole = null;
    let pollInterval = null;
    let isWaiting = false;
    // ==========================================
    // FRONTEND STATE CONTROLLERS
    // ==========================================

    /**
     * Action 1: Player selects a mode ('normal', 'sf', etc.)
     * Triggered directly via button onclick
     */
    function selectMode(modeKey) {
        currentSelectedMode = modeKey;

        // Update UI Mode Display Indicator
        const modeLabel = document.getElementById('current-mode-label');
        if (modeLabel) {
            modeLabel.innerText = modeKey.toUpperCase();
        }

        // Highlight selected mode button
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('selected'));
        const activeBtn = document.getElementById(`btn-mode-${modeKey}`);
        if (activeBtn) activeBtn.classList.add('selected');

        updateMenuTitle();
        renderMenu(1);

        // Hide mode selection overlay
        const gameModeOverlay = document.getElementById('game-mode');
        if (gameModeOverlay) {
            gameModeOverlay.style.opacity = "0";
            gameModeOverlay.style.visibility = "hidden";
            setTimeout(() => { gameModeOverlay.style.display = "none"; }, 400); 
        }

        // Notify Google Apps Script Backend
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(res => {
                    console.log(`[State] Mode set to: ${res.mode} | Status: choosing`);
                })
                .setPlayerStatus(playerName, 'choosing', currentSelectedMode);
        }
    }

    /**
     * Action 2: Player returns to Mode Selection Screen
     */
    function backToModeSelection() {
        stopMatchPolling();
        disconnectPeer();
        currentSelectedMode = null;
        isWaiting = false;

        // Reset Mode Display Indicator
        const modeLabel = document.getElementById('current-mode-label');
        if (modeLabel) modeLabel.innerText = "UNSELECTED";

        p1SelChar = {}; p2SelChar = {};
        const startBtn = document.getElementById('start-btn');
        if (startBtn) {
            startBtn.innerText = "VS";
            startBtn.classList.remove('waiting');
        }

        const gameModeOverlay = document.getElementById('game-mode');
        if (gameModeOverlay) {
            gameModeOverlay.style.display = "flex";
            setTimeout(() => {
                gameModeOverlay.style.opacity = "1";
                gameModeOverlay.style.visibility = "visible";
            }, 10);
        }

        backToMenu();

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(res => {
                    console.log("[State] Returned to Mode Selection screen.");
                })
                .setPlayerStatus(playerName, 'choosing', 'Unselected');
        }
    }

    /**
     * Action 3: Player clicks "READY" / "FIND MATCH"
     */
    function clickReady() {
        if (!currentSelectedMode) {
            alert("Select a mode first!");
            return;
        }

        isWaiting = true;
        const startBtn = document.getElementById('start-btn');
        const titleEl = document.getElementById('char-select-title');
        if (titleEl) titleEl.innerText = "Searching for Match...";
        if (startBtn) {
            startBtn.innerText = "Cancel";
            startBtn.classList.add('waiting');
        }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(res => {
                    myRole = res.role;
                    console.log(`[Queue] Searching... Mode: ${res.mode} | Role: ${res.role} | Room: ${res.roomId}`);

                    if (res.role === 'P1') {
                        peer.on('connection', (conn) => {
                            connection = conn;
                            bindPeerEvents();
                        });
                    }

                    startMatchPolling();
                })
                .setPlayerStatus(playerName, 'waiting', currentSelectedMode, myPeerId);
        }
    }

    /**
     * Action 4: Player clicks "CANCEL MATCHMAKING"
     */
    function cancelQueue() {
        stopMatchPolling();
        disconnectPeer();
        myRole = null;
        isWaiting = false;

        const startBtn = document.getElementById('start-btn');
        if (startBtn) {
            startBtn.innerText = "VS";
            startBtn.classList.remove('waiting');
        }
        updateMenuTitle();

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(res => {
                    console.log("[State] Matchmaking cancelled. Returned to choosing state.");
                })
                .setPlayerStatus(playerName, 'choosing', currentSelectedMode);
        }
    }

    // ==========================================
    // MATCH POLLING & P2P DATA TRANSFER
    // ==========================================

    function startMatchPolling() {
        stopMatchPolling();
        pollInterval = setInterval(() => {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(res => {
                        if (res.status === 'playing') {
                            stopMatchPolling();
                            console.log(`[Match Found!] Opponent: ${res.opponent} | Role: ${res.role}`);

                            if (myRole === 'P2' && !connection) {
                                connection = peer.connect(res.p1PeerId);
                                bindPeerEvents();
                            }
                            
                            document.getElementById('menu').style.display = 'none';
                        }
                    })
                    .checkRoomStatus(playerName);
            }
        }, 1500);
    }

    function stopMatchPolling() {
        if (pollInterval) {
            clearInterval(pollInterval);
            pollInterval = null;
        }
    }

    function disconnectPeer() {
        if (connection) {
            connection.close();
            connection = null;
        }
    }

    function bindPeerEvents() {
        connection.on('open', () => {
            console.log("[P2P] WebRTC connection established with opponent.");
            sendGameMove({ type: 'HANDSHAKE', player: playerName });
        });

        connection.on('data', (data) => {
            console.log("[P2P Received]:", data);
            if (data.type === 'INPUT') {
                if (myRole === 'P1') {
                    p2Touch.joyX = data.joyX;
                    p2Touch.joyY = data.joyY;
                } else {
                    p1Touch.joyX = data.joyX;
                    p1Touch.joyY = data.joyY;
                }
            }
        });

        connection.on('close', () => {
            console.log("[P2P] Opponent disconnected.");
        });
    }

    function sendGameMove(moveData) {
        if (connection && connection.open) {
            connection.send(moveData);
        }
    }

    function updateMenuTitle() {
        const titleEl = document.getElementById('char-select-title');
        if (titleEl) {
            titleEl.innerText = currentSelectedMode === 'sf' ? 'Choose Three Characters' : 'Choose a Character';
        }
    }

    function renderMenu(pid) {
        let container = document.getElementById(pid === 1 ? 'p1-char-container' : 'p2-char-container');
        if (!container) return;
        
        const pIdx = pid === 1 ? p1Page : p2Page;
        const sel = pid === 1 ? p1CharIdx : p2CharIdx;
        const selDict = pid === 1 ? p1SelChar : p2SelChar;
        container.innerHTML = '';
        const start = pIdx * PAGE_SIZE, end = Math.min(start + PAGE_SIZE, CHAR_DATA.length);
        
        for (let i = start; i < end; i++) {
            let className = "char-btn";
            let charSelected = Object.values(selDict).includes(i);
            let charChoosenOrder = Object.keys(selDict).find(order => selDict[order] === i);
            
            if (currentSelectedMode === "sf") {
                if (charSelected) className += " selected selected" + String(charChoosenOrder);
            } else {
                if (i === sel) className += " selected";
            }
            
            const btn = document.createElement('div'); 
            btn.className = className;
            btn.innerHTML = CHAR_DATA[i].name;
            if (!charSelected) {
                btn.onclick = () => selectChar(pid === 1 ? 0 : 1, i);
            } else {
                btn.onclick = () => selectChar(pid === 1 ? 0 : 1, i, true, charChoosenOrder);
            }
            container.appendChild(btn);
        }
    }

    function selectChar(pIdx, charIdx, choosed = false, order = null) {
        if (isWaiting) return;
        if (currentSelectedMode === "sf") {
            if (!choosed) {
                if (pIdx === 0) {
                    if (p1SelProgress.length === 0) return;
                    p1SelChar[p1SelProgress[0]] = charIdx;
                    p1SelProgress.shift();
                    renderMenu(1);
                }
            } else {
                if (pIdx === 0) {
                    delete p1SelChar[order];
                    p1SelProgress.push(order);
                    p1SelProgress.sort();
                    renderMenu(1);
                }
            }
        } else {
            if (pIdx === 0) p1CharIdx = charIdx; else p2CharIdx = charIdx; 
            renderMenu(pIdx === 0 ? 1 : 2); 
        }
    }

    function backToMenu() {
        document.getElementById('menu').style.display = 'flex';
        document.getElementById('game-over').style.display = 'none';
        updateMenuTitle();
    }

    function setupJoy(joyId, stickId, touchObj) {
        const joy = document.getElementById(joyId), stick = document.getElementById(stickId);
        if (!joy || !stick) return;
        
        const move = (e) => {
            const t = e.targetTouches[0], rect = joy.getBoundingClientRect();
            let dx = t.clientX - (rect.left + rect.width / 2), dy = t.clientY - (rect.top + rect.height / 2);
            const d = Math.min(55, Math.hypot(dx, dy)), angle = Math.atan2(dy, dx);
            stick.style.transform = `translate(${Math.cos(angle)*d}px, ${Math.sin(angle)*d}px)`;
            touchObj.joyX = Math.cos(angle) * (d / 55); 
            touchObj.joyY = Math.sin(angle) * (d / 55);
            sendGameMove({ type: 'INPUT', joyX: touchObj.joyX, joyY: touchObj.joyY });
        };

        joy.addEventListener('touchstart', (e) => { e.preventDefault(); move(e); });
        joy.addEventListener('touchmove', (e) => { e.preventDefault(); move(e); });
        joy.addEventListener('touchend', () => { 
            stick.style.transform = `translate(0,0)`; 
            touchObj.joyX = 0; touchObj.joyY = 0; 
            sendGameMove({ type: 'INPUT', joyX: 0, joyY: 0 });
        });
    }

    // --- Game Logic ---
    function checkMatchEnd() {
        if((p1.hp <= 0 || p2.hp <= 0) && !gameOver) {
            if(currentGameMode === "normal" || (p1.hp <= 0 && p1PlayProgress === 3 )||(p2.hp <= 0 && p2PlayProgress === 3)){
                playSkillSound(9998, 's1')
                gameOver = true;
                p1SelProgress = [1,2,3];
                p2SelProgress = [1,2,3];
                p1PlayProgress = 1
                p2PlayProgress = 1
                setGameTimeout(() => { 
                    document.getElementById('winner-text').innerText = (p1.hp > 0 ? "玩家 1" : "玩家 2") + " 獲勝！"; 
                    document.getElementById('game-over').style.display = 'flex'; 
                }, 2000);
            }else{
                projectiles = []; particles = []; floatTexts = [];
                if(p1.hp <= 0 ){
                    let x = p1.x;
                    let y = p1.y;
                    p1PlayProgress += 1;
                    p1 = new Player(1, p1SelChar[p1PlayProgress], width/2, height - 200); 
                    p1.x = x
                    p1.y = y
                }else{
                    let x = p2.x;
                    let y = p2.y;
                    p2PlayProgress += 1;
                    p2 = new Player(2, p2SelChar[p2PlayProgress], width/2, 200);
                    p2.x = x;
                    p2.y = y;
                }
                p1.target = p2; p2.target = p1; gameRunning = true; gameOver = false;
            }
        }
    }
    
    function startGame() {
        if(currentGameMode === "sf" && (p1SelChar[3] === undefined || p2SelChar[3] === undefined)){return}
        document.getElementById('menu').style.display = 'none';
        clearGameTimers(); resize();
        if(currentGameMode === "sf"){
            p1CharIdx = p1SelChar[p1PlayProgress]
            p2CharIdx = p2SelChar[p2PlayProgress]
        }
        p1 = new Player(1, p1CharIdx, width/2, height - 200); p2 = new Player(2, p2CharIdx, width/2, 200);
        p1.target = p2; p2.target = p1; gameRunning = true; gameOver = false; timeScale = 1.0; shakeAmount = 0; deathFocus = null;
        projectiles = []; particles = []; floatTexts = [];
        if((currentGameMode === " normal" || (p1PlayProgress === 1 && p2PlayProgress === 1)) && !playAgain){requestAnimationFrame(gameLoop);}
    }
    function backToMenu() {
        gameRunning = false; playAgain = false;clearGameTimers();
        document.getElementById('game-over').style.display = 'none'; document.getElementById('menu').style.display = 'flex';
        renderMenu(1); renderMenu(2);
    }
    function gameLoop() {
        if(!gameRunning){return};
        const dt = 16.6; p1.update(dt); p2.update(dt);
        [p1, p2].forEach(p => {
             const t = p.id === 1 ? p1Touch : p2Touch;
             if(!p.isLock && !p.isDying) { p.x += t.joyX * p.speed * p.buffs.speed; p.y += t.joyY * p.speed * p.buffs.speed; }
             
             // Forced movements (Taunt / Suction)
             if (!p.isUntouchable) {
                 if(p.status.taunted > 0 && p.tauntTarget) { 
                     let ang = Math.atan2(p.tauntTarget.y - p.y, p.tauntTarget.x - p.x); 
                     p.x += Math.cos(ang) * p.speed * 0.5; p.y += Math.sin(ang) * p.speed * 0.5; 
                 }
                 if(p.target.charIdx === 1 && p.target.taiS1Active && dist(p, p.target) < 300) {
                     p.x += (p.target.x - p.x) * 0.1; p.y += (p.target.y - p.y) * 0.3; // Suction 0.3
                 }
                 if(p.target?.charIdx === 12 && p.target?.skills?.s2?.active){}
             }
             
             // Mars S3 Flight
            if(p.charIdx === 11 && p.isMarsFlying) {
                p.applyStatus("stunned", 500);
                let distToTarget = dist(p, {x: p.ultTargetX, y: p.ultTargetY});
                let step = 20 * timeScale;
            
                if(distToTarget > step) {
                    let ang = Math.atan2(p.ultTargetY - p.y, p.ultTargetX - p.x);
                    p.x += Math.cos(ang) * step; 
                    p.y += Math.sin(ang) * step; 
                    particles.push(new Particle(p.x, p.y, "red", "normal", "", 0.5)); 
                } else {
                    // --- 1. Snap to target position and unlock Mars IMMEDIATELY ---
                    p.x = p.ultTargetX; 
                    p.y = p.ultTargetY;
                    p.isMarsFlying = false; 
                    p.isCasting = false;        // Fixed: Unlocks movement & abilities
                    p.isUntouchable = false;
                    p.activeWarning = null;
            
                    // Visual effects & buff
                    shakeAmount = 40; 
                    for(let i = 0; i < 180; i++) particles.push(new Particle(p.x, p.y, "orange", "normal", "🔥", 3.0)); 
                    p.marsBuffTimer = 5000; 
            
                    // --- 2. Calculate Damage & Check Achievement ---
                    let dmg = 300 + (p.energyConsumed / 100) * 85;
                    
                    if(dist(p, p.target) < 250) { 
                        p.target.takeDamage(dmg, 11); 
                        p.target.applyStatus('stunned', 1000); 
            
                        // Trigger "天外來星" on full-energy kill
                        if (p.energyConsumed >= 1000 && p.target.hp <= 0) {
                            showAchievement("天外來星", "255, 69, 0", "#ffffff");
                        }
                    }
                }
            }
             if(p.charIdx === 10 && p.activeWarning && p.activeWarning.type === 'circle') { p.activeWarning.x = p.x; p.activeWarning.y = p.y; }
             
             p.x = Math.max(p.radius, Math.min(width - p.radius, p.x)); p.y = Math.max(p.radius, Math.min(height - p.radius, p.y));
        });
        projectiles.forEach(p => p.update()); projectiles = projectiles.filter(p => p.life > 0);
        particles.forEach(p => p.update()); particles = particles.filter(p => p.life > 0);
        floatTexts.forEach(t => t.update()); floatTexts = floatTexts.filter(t => t.life > 0);
        if(shakeAmount > 0) shakeAmount *= 0.85;
        draw(); updateButtonCD(p1, "p1"); updateButtonCD(p2, "p2");
        requestAnimationFrame(gameLoop);
    }
