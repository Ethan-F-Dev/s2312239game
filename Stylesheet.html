<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap');

  :root {
    --bg-dark: #08090d;
    --panel-bg: rgba(18, 22, 34, 0.75);
    --panel-border: rgba(255, 255, 255, 0.12);
    --accent-gold: #ffd700;
    --accent-red: #ff2a5f;
    --accent-cyan: #00f0ff;
    --text-primary: #ffffff;
    --text-secondary: #8b94a0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-primary);
    line-height: 1.6;
    overflow-x: hidden;
  }

  .navbar {
    background: rgba(8, 9, 13, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--panel-border);
    position: sticky; top: 0; z-index: 1000;
  }

  .nav-container {
    max-width: 1100px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px;
  }

  .nav-logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem; font-weight: 900;
    color: var(--accent-cyan); text-decoration: none; letter-spacing: 2px;
  }

  .nav-menu { display: flex; list-style: none; gap: 15px; }
  .nav-item { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 700; }
  .nav-item:hover, .nav-item.active { color: var(--accent-cyan); }

  .hero-banner {
    min-height: 320px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 50px 20px 70px;
    background: 
      radial-gradient(ellipse at top, rgba(0, 240, 255, 0.15), transparent 70%),
      radial-gradient(ellipse at bottom, rgba(255, 42, 95, 0.15), var(--bg-dark));
    border-bottom: 1px solid var(--panel-border);
  }

  .title-tag {
    background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan); padding: 6px 16px; border-radius: 20px;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 15px;
  }

  .hero-banner h1 {
    font-size: 4rem; font-weight: 900; letter-spacing: 4px;
    text-shadow: 0 4px 15px rgba(0,0,0,0.8);
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

  .entry-card {
    max-width: 480px; margin: -60px auto 40px;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 30px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    text-align: center; position: relative; z-index: 10;
  }

  .entry-card h3 {
    font-family: 'Orbitron', sans-serif;
    color: var(--accent-cyan); font-size: 1.1rem; margin-bottom: 6px;
  }

  .section-desc { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 20px; }

  .action-buttons { display: flex; flex-direction: column; gap: 12px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px; border-radius: 8px; font-weight: 700;
    font-size: 0.95rem; cursor: pointer; border: none; transition: all 0.2s ease;
  }

  .btn-guest {
    background: var(--accent-red); color: #fff;
    box-shadow: 0 4px 15px rgba(255, 42, 95, 0.3);
  }
  .btn-guest:hover { background: #e02050; transform: translateY(-2px); }

  .btn-terminal {
    background: transparent; border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
  }
  .btn-terminal:hover { background: rgba(0, 240, 255, 0.1); transform: translateY(-2px); }

  .section-title {
    font-family: 'Orbitron', sans-serif; text-align: center;
    font-size: 1.6rem; letter-spacing: 2px; margin-bottom: 30px;
  }

  .screenshots-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 60px; }
  .screenshot-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px; overflow: hidden; position: relative; }
  .screenshot-card img { width: 100%; height: 180px; object-fit: cover; display: block; }
  .card-badge { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.8); border: 1px solid var(--panel-border); color: var(--accent-cyan); padding: 4px 10px; font-size: 0.75rem; font-weight: 700; border-radius: 4px; }

  .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .social-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 25px; text-align: center; }
  .social-card h3 { font-size: 1rem; margin-bottom: 15px; }
  .yt-dev-box, .ig-box { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .yt-avatar { width: 50px; height: 50px; background: rgba(255, 0, 0, 0.1); border: 2px solid #ff0000; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #ff0000; }
  .channel-title { font-size: 1.1rem; color: #fff; }
  .channel-tag { font-size: 0.8rem; color: var(--text-secondary); }
  .yt-sub-btn { background: #ff0000; color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 0.85rem; }
  .ig-link { color: #e1306c; text-decoration: none; font-weight: 700; font-size: 1rem; }

  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
    justify-content: center; align-items: center; z-index: 2000;
  }

  .modal-content {
    background: #0d1017; border: 1px solid var(--panel-border);
    border-radius: 16px; width: 90%; max-width: 440px; padding: 30px;
    position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  }

  .close-btn {
    position: absolute; top: 15px; right: 20px;
    background: transparent; border: none; font-size: 1.5rem;
    color: var(--text-secondary); cursor: pointer;
  }
  .close-btn:hover { color: #fff; }

  .modal-header h3 {
    font-family: 'Orbitron', sans-serif; color: var(--accent-cyan);
    font-size: 1.1rem; text-align: center;
  }

  .step-indicator {
    text-align: center; font-size: 0.8rem; font-weight: bold;
    color: var(--accent-gold); margin: 6px 0 15px;
  }

  .player-status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }

  .player-badge {
    padding: 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .player-badge.unverified { background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border); color: var(--text-secondary); }
  .player-badge.verified { background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; color: #00ff88; }

  .auth-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
  .tab-btn {
    flex: 1; padding: 8px; background: rgba(255,255,255,0.05);
    border: 1px solid var(--panel-border); color: var(--text-secondary);
    border-radius: 6px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 0.8rem;
  }
  .tab-btn.active {
    background: var(--accent-cyan); color: #000; font-weight: 700; border-color: var(--accent-cyan);
  }

  .input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; text-align: left; }
  .input-group label { font-size: 0.75rem; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; }
  .input-group input {
    width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.6);
    border: 1px solid var(--panel-border); border-radius: 6px;
    color: #fff; font-size: 0.9rem; outline: none; transition: border-color 0.2s;
  }
  .input-group input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }

  .btn-primary { background: var(--accent-red); color: #fff; }
  .btn-primary:hover { background: #e02050; }

  .btn-launch-disabled { background: #161a24; color: var(--text-secondary); border: 1px solid var(--panel-border); cursor: not-allowed; }
  .btn-launch-active { background: linear-gradient(135deg, #00c853, #00e676); color: #000; font-weight: 900; box-shadow: 0 0 15px rgba(0, 230, 118, 0.5); }

  #auth-status { margin-top: 12px; font-size: 0.85rem; text-align: center; min-height: 18px; font-weight: 600; }
  .status-success { color: #00ff88; }
  .status-error { color: #ff4d4d; }

  footer { text-align: center; padding: 30px 20px; border-top: 1px solid var(--panel-border); color: var(--text-secondary); font-size: 0.85rem; margin-top: 50px; }
  @media (max-width: 600px) { .hero-banner h1 { font-size: 2.5rem; } .nav-menu { display: none; } }
</style>
